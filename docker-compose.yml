version: '3.8'

services:
  db_postgres:
    image: postgres:15
    container_name: rag_assistant
    restart: always
    environment:
      POSTGRES_USER: ${db_user_env}   
      POSTGRES_PASSWORD: ${db_password_env} 
      POSTGRES_DB: ${db_name_env}       
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend_app:
    build: .
    container_name: fastapi_app
    depends_on:
      - db_postgres
    volumes:
      - .:/app  
    environment:
      # --- CRITICAL FIX BELOW ---
      # The LEFT side matches your Python os.getenv("...")
      # The RIGHT side is the value/variable
      
      - db_user_env=${db_user_env}
      - db_password_env=${db_password_env}
      - db_host_env=db_postgres      # <--- Python looks for 'db_host_env', not 'DB_HOST'
      - db_port_env=5432
      - db_name_env=${db_name_env}

      # These can stay uppercase if your code expects them that way, 
      # but usually, stick to one style.
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
    ports:
      - "8000:8000"

volumes:
  postgres_data: